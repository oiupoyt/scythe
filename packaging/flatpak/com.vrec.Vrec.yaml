app-id: com.vrec.Vrec
runtime: org.gnome.Platform
runtime-version: '46'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: vrec-ui
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --filesystem=xdg-videos
  - --filesystem=xdg-run/pipewire-0:ro
  - --device=all
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.ScreenCast

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/vrec/cargo

modules:
  - name: vrec
    buildsystem: simple
    build-commands:
      - cargo build --release --verbose
      - install -Dm755 target/release/vrec-daemon /app/bin/vrec-daemon
      - install -Dm755 target/release/vrec-ui /app/bin/vrec-ui
      - install -Dm644 packaging/vrec.desktop /app/share/applications/com.vrec.Vrec.desktop
    sources:
      - type: git
        url: https://github.com/oiupoyt/vrec.git
        branch: main
