[package]
name = "scythe"
version = "0.2.1"
edition = "2024"

[[bin]]
name = "scythe-daemon"
path = "src/bin/scythe-daemon.rs"

[[bin]]
name = "scythe-ui"
path = "src/bin/scythe-ui.rs"

[dependencies]
crossbeam-channel = "0.5.16"
ffmpeg-next = "9.0.0"
ffmpeg-sys-next = "9.0.0"
gdk = "0.18.2"
glib = "0.22.9"
global-hotkey = "0.8.0"
gtk = { version = "0.18.2", package = "gtk" }
libc = "0.2.189"
mp4 = "0.14.0"
ringbuf = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread", "signal", "time"] }
dirs = "6.0.0"
cpal = "0.18.2"
rubato = "5.0.0"
eframe = "0.31"
egui = "0.31"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13.13", features = ["screencast"] }
gtk-layer-shell = { version = "0.8.2", features = ["v0_5"] }
pipewire = "0.10.1"
xcb = { version = "1.7.1", features = ["shm", "xfixes"] }
memmap2 = "0.9.11"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
