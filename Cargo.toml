[package]
name = "vrec"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = { version = "0.13.13", features = ["screencast"] }
crossbeam-channel = "0.5.16"
ffmpeg-next = "9.0.0"
ffmpeg-sys-next = "9.0.0"
gdk = "0.18.2"
glib = "0.22.9"
global-hotkey = "0.8.0"
gtk-layer-shell = "0.8.2"
gtk = { version = "0.18.2", package = "gtk" }
libc = "0.2.189"
memmap2 = "0.9.11"
mp4 = "0.14.0"
pipewire = "0.10.1"
ringbuf = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
xcb = { version = "1.7.1", features = ["shm", "xfixes"] }
dirs = "6.0.0"
cpal = "0.18.2"
rubato = "5.0.0"
