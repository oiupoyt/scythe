[package]
name = "vrec"
version = "0.1.0"
edition = "2024"

[dependencies]
ashpd = { version = "0.13.13", features = ["screencast"] }
crossbeam-channel = "0.5.16"
ffmpeg-next = "9.0.0"
ffmpeg-sys-next = "9.0.0"
global-hotkey = "0.8.0"
libc = "0.2.189"
memmap2 = "0.9.11"
minifb = "0.28.0"
mp4 = "0.14.0"
pipewire = "0.10.1"
ringbuf = "0.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros", "rt-multi-thread"] }
xcb = { version = "1.7.1", features = ["shm", "xfixes"] }
